spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:http://localhost:8888

server:
  port: 8088

groq:
  api:
    key: ${GROQ_API_KEY:your_groq_api_key_here}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka-secret@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.fundbridge: DEBUG
